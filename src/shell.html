<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}" />
<meta name="theme-color" content="#1C1D20" />
{{ROBOTS}}
<meta property="og:title" content="{{OG_TITLE}}" />
<meta property="og:description" content="{{OG_DESCRIPTION}}" />
<meta property="og:type" content="{{OG_TYPE}}" />
<meta property="og:url" content="{{CANONICAL}}" />
<meta property="og:image" content="{{OG_IMAGE}}" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{OG_TITLE}}" />
<meta name="twitter:description" content="{{OG_DESCRIPTION}}" />
<meta name="twitter:image" content="{{OG_IMAGE}}" />
<link rel="canonical" href="{{CANONICAL}}" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231C1D20'/%3E%3Ccircle cx='32' cy='32' r='11' fill='%23D7FF3E'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script>document.documentElement.classList.remove('no-js');document.documentElement.classList.add('js');</script>
<script>(function(){try{var t=localStorage.getItem('jn-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<script>(function(){try{if(sessionStorage.getItem('jn-preloaded')==='1')document.documentElement.classList.add('preloaded');}catch(e){}})();</script>
<link rel="stylesheet" href="/assets/site.css" />
<noscript><style>.preloader{display:none}.cursor,.cursor-ring,.cursor-label{display:none}[data-reveal]{opacity:1!important;transform:none!important}.intro__big .w{opacity:1!important}.page{display:block!important}</style></noscript>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<!-- CURSOR -->
<div class="cursor" aria-hidden="true"></div>
<div class="cursor-ring" aria-hidden="true"></div>
<div class="cursor-label" aria-hidden="true">View</div>

<!-- PRELOADER -->
<div class="preloader" id="preloader" aria-hidden="true">
  <div class="preloader__count mono" id="preCount">00</div>
  <div class="preloader__word" id="preWord">Hello</div>
  <div class="preloader__bar" id="preBar"></div>
</div>

<!-- TRANSITION CURTAIN -->
<div class="curtain" id="curtain" aria-hidden="true">
  <div class="curtain__panel"></div><div class="curtain__panel"></div><div class="curtain__panel"></div><div class="curtain__panel"></div><div class="curtain__panel"></div>
  <div class="curtain__label" id="curtainLabel"></div>
</div>

<!-- HEADER -->
<header class="header" id="header">
  <a href="/" class="header__brand" data-route="home" data-magnetic><span class="c">©</span> Jordan Nwachukwu</a>
  <nav class="header__nav" aria-label="Primary">
    <a href="/work/" class="header__link{{ACTIVE_WORK}}" data-route="work">Work</a>
    <a href="/about/" class="header__link{{ACTIVE_ABOUT}}" data-route="about">About</a>
    <a href="/contact/" class="header__link{{ACTIVE_CONTACT}}" data-route="contact">Contact</a>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to light mode" aria-pressed="false" data-magnetic>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z"/></svg>
    </button>
    <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false" data-magnetic>
      <span class="menu-btn__label">Menu</span>
      <span class="menu-btn__icon" aria-hidden="true"><span></span><span></span></span>
    </button>
  </nav>
</header>

<!-- MENU OVERLAY -->
<div class="menu" id="menu" role="dialog" aria-modal="true" aria-label="Site menu">
  <div class="menu__inner">
    <nav class="menu__links" aria-label="Menu">
      <a href="/" class="menu__link" data-route="home"><span class="idx">01</span><span class="line-mask"><span class="txt">Home</span></span></a>
      <a href="/work/" class="menu__link" data-route="work"><span class="idx">02</span><span class="line-mask"><span class="txt">Work</span></span></a>
      <a href="/about/" class="menu__link" data-route="about"><span class="idx">03</span><span class="line-mask"><span class="txt">About</span></span></a>
      <a href="/contact/" class="menu__link" data-route="contact"><span class="idx">04</span><span class="line-mask"><span class="txt">Contact</span></span></a>
    </nav>
    <div class="menu__aside">
      <div class="menu__img"><img src="/assets/about-studio.jpg" alt="Jordan's studio workspace" loading="lazy" /></div>
      <div class="menu__socials">
        <a href="https://www.instagram.com/jordannwachukwu" target="_blank" rel="noopener" data-social>Instagram</a>
        <a href="https://www.x.com/jordanified" target="_blank" rel="noopener" data-social>X / Twitter</a>
        <a href="https://www.linkedin.com/in/jordannwachukwu" target="_blank" rel="noopener" data-social>LinkedIn</a>
      </div>
    </div>
  </div>
</div>

<!-- FLOATING WORK PREVIEW -->
<div class="work-preview" id="workPreview" aria-hidden="true"><img src="/assets/work/bonita-cover.jpg" alt="" /></div>

<main id="main">
{{PAGE}}
</main>

<!-- FOOTER (global) -->
<footer class="footer" id="footer">
  <div class="wrap footer__cta">
    <h2 class="footer__title" data-reveal><span class="footer__pic" role="img" aria-label="Portrait of Jordan Nwachukwu"></span>Let's work <span class="accent">together</span></h2>
    <span class="magnetic" data-magnetic data-strength="0.5">
      <a href="/contact/" class="footer__btn" data-route="contact" aria-label="Get in touch">
        <span>Get in touch</span>
        <svg class="arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17L17 7M17 7H8M17 7v9"/></svg>
      </a>
    </span>
    <div class="footer__contact" data-reveal>
      <a href="mailto:hello@jordannwachukwu.com" data-contact-email><span class="fill" aria-hidden="true"></span><svg class="arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg><span class="lbl">hello@jordannwachukwu.com</span></a>
      <div class="phone-split" id="phoneSplit">
        <button type="button" class="phone-split__trigger" aria-expanded="false" aria-controls="phoneBubbles" data-contact-phone><span class="fill" aria-hidden="true"></span><svg class="arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h4l2 5-3 2a12 12 0 005 5l2-3 5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/></svg><span class="lbl">+234 811 141 7027</span></button>
        <div class="phone-split__bubbles" id="phoneBubbles" role="group" aria-label="Call or WhatsApp Jordan">
          <a class="bubble bubble--call" href="tel:+2348111417027" aria-label="Call +234 811 141 7027"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-3 2a12 12 0 005 5l2-3 5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/></svg></a>
          <a class="bubble bubble--wa" href="https://wa.me/2348111417027" target="_blank" rel="noopener" aria-label="WhatsApp +234 811 141 7027"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/><g transform="translate(6.6 6.6) scale(0.45)" stroke-width="4.44"><path d="M5 4h4l2 5-3 2a12 12 0 005 5l2-3 5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/></g></svg></a>
        </div>
      </div>
    </div>
  </div>
  <div class="wrap footer__bottom">
    <div class="footer__col"><div class="k">Version</div><div class="v">2026 © Edition</div></div>
    <div class="footer__col"><div class="k">Socials</div>
      <div class="footer__socials">
        <a href="https://www.instagram.com/jordannwachukwu" target="_blank" rel="noopener" data-social>Instagram</a>
        <a href="https://www.x.com/jordanified" target="_blank" rel="noopener" data-social>X</a>
        <a href="https://www.linkedin.com/in/jordannwachukwu" target="_blank" rel="noopener" data-social>LinkedIn</a>
      </div>
    </div>
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" integrity="sha384-g4NTh/Iv5PPU4xPyhEWqPcwtNXOvdaDI8LLnyYfyNZOjKJeYQyjzQ9X5275eBjpt" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" integrity="sha384-Z3REaz79l2IaAZqJsSABtTbhjgOUYyV3p90XNnAPCSHg3EMTz1fouunq9WZRtj3d" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js" integrity="sha384-li4UtcFCH6QeUqR4JyV58/VgTprMuz9aauj+oWtew7V4Y7ZVjnvz5px9Y3UCG0Ea" crossorigin="anonymous"></script>
<script>window.__JN={{DATA}};</script>
<script src="/assets/site.js"></script>
</body>
</html>
