<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3D Product Mockup - Studio Scene</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root{--bg:#07090C;--panel:rgba(13,17,23,.82);--line:#232A38;--ink:#E8ECF4;--muted:#9AA6BC;--acc:#35E0FF;--acc2:#7C5CFF;--mono:'JetBrains Mono',monospace;--disp:'Space Grotesk',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--disp);overflow:hidden;height:100vh}
#stage{position:fixed;inset:0}
canvas{display:block}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:var(--acc)}
.hud{position:fixed;top:18px;left:20px;z-index:5;pointer-events:none}
.hud .k{font-family:var(--mono);font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;color:var(--acc)}
.hud h1{font-size:1.5rem;font-weight:700;letter-spacing:-.01em;margin-top:.3rem}
.hud p{font-family:var(--mono);font-size:.66rem;color:var(--muted);margin-top:.3rem}
.panel{position:fixed;top:18px;right:18px;bottom:18px;width:264px;z-index:6;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:1rem;overflow-y:auto;display:flex;flex-direction:column;gap:.85rem}
.panel h2{font-family:var(--mono);font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:.6rem}
.ctl{display:grid;gap:.3rem}
.ctl label{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ctl label output{color:var(--acc)}
.ctl input[type=range]{width:100%;accent-color:var(--acc);height:18px}
.ctl select{background:#0D1117;border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:.35rem .5rem;font-family:var(--mono);font-size:.68rem;outline:none}
.row{display:flex;gap:.5rem;align-items:center;justify-content:space-between}
.sw{display:flex;align-items:center;gap:.5rem;font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.sw input{accent-color:var(--acc);width:15px;height:15px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:auto}
.btns button{border:1px solid var(--line);background:#0D1117;color:var(--ink);border-radius:8px;padding:.5rem .4rem;font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;transition:all .25s}
.btns button:hover{border-color:var(--acc);color:var(--acc)}
.btns button.wide{grid-column:1/-1;background:linear-gradient(120deg,var(--acc),var(--acc2));border:0;color:#041018;font-weight:700}
.hint{position:fixed;left:20px;bottom:16px;z-index:5;font-family:var(--mono);font-size:.62rem;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;pointer-events:none}
@media (max-width:760px){.panel{width:210px;top:auto;bottom:12px;right:12px;max-height:46vh}.hud h1{font-size:1.1rem}}
</style>
</head>
<body>
<div id="stage"></div>
<div class="hud"><span class="k" id="hudK">3D product mockup</span><h1 id="hudTitle">Studio scene</h1><p id="hudSub">drag to orbit · wheel to zoom</p></div>
<div class="panel">
  <h2>Scene controls</h2>
  <div class="ctl"><label>Orbit speed <output id="oSpeed">0.10</output></label><input type="range" id="cSpeed" min="0" max="0.6" step="0.01" value="0.10"></div>
  <div class="ctl"><label>Camera distance <output id="oDist">7.2</output></label><input type="range" id="cDist" min="4" max="12" step="0.1" value="7.2"></div>
  <div class="ctl"><label>Camera height <output id="oHeight">2.2</output></label><input type="range" id="cHeight" min="0.4" max="6" step="0.1" value="2.2"></div>
  <div class="ctl"><label>Key intensity <output id="oKey">2.2</output></label><input type="range" id="cKey" min="0" max="5" step="0.1" value="2.2"></div>
  <div class="ctl"><label>Rim intensity <output id="oRim">3.0</output></label><input type="range" id="cRim" min="0" max="8" step="0.1" value="3.0"></div>
  <div class="ctl"><label>Glow <output id="oGlow">0.8</output></label><input type="range" id="cGlow" min="0" max="2" step="0.05" value="0.8"></div>
  <div class="ctl"><label>Particles <output id="oPart">260</output></label><input type="range" id="cPart" min="0" max="900" step="20" value="260"></div>
  <div class="ctl"><label>Fog density <output id="oFog">0.045</output></label><input type="range" id="cFog" min="0" max="0.12" step="0.005" value="0.045"></div>
  <div class="ctl"><label>Device tilt <output id="oTilt">-14</output></label><input type="range" id="cTilt" min="-40" max="20" step="1" value="-14"></div>
  <div class="ctl"><label>Palette</label><select id="cPal"><option value="0">Signature</option><option value="1">Alt A</option><option value="2">Alt B</option></select></div>
  <div class="ctl"><label>Quality</label><select id="cQual"><option value="1.75">High</option><option value="1.25">Medium</option><option value="0.8">Draft</option></select></div>
  <div class="row"><label class="sw"><input type="checkbox" id="cWire">Wireframe</label><label class="sw"><input type="checkbox" id="cGrid">Grid</label></div>
  <div class="row"><label class="sw"><input type="checkbox" id="cAuto" checked>Auto-orbit</label><label class="sw"><input type="checkbox" id="cDof" checked>Depth haze</label></div>
  <div class="btns">
    <button id="bReset">Reset</button><button id="bRand">Randomize</button>
    <button class="wide" id="bExport">Export PNG</button>
  </div>
</div>
<div class="hint">drag orbit · wheel zoom · panel live</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" integrity="sha384-CI3ELBVUz9XQO+97x6nwMDPosPR5XvsxW2ua7N1Xeygeh1IxtgqtCkGfQY9WWdHu" crossorigin="anonymous"></script>
<script>
const $ = s => document.querySelector(s);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const ID = new URLSearchParams(location.search).get('id') || 'ai-studio';
const PAL = {
  'ai-studio': { name: 'AI Video Studio', sub: 'prompt → timeline · product mockup', bg: 0x07090C, sets: [[0x35E0FF, 0x7C5CFF, 0xFF4D8D], [0x3DDC97, 0x35E0FF, 0xFFB454], [0xFF4D8D, 0xFFB454, 0x7C5CFF]] },
  'saas': { name: 'Platform Console', sub: 'multi-tenant SaaS · product mockup', bg: 0x0A0F14, sets: [[0x0E9F6E, 0x2563EB, 0x7C3AED], [0x2563EB, 0x0E9F6E, 0xD97706], [0xD97706, 0xDC2626, 0x2563EB]] },
  'study-abroad': { name: 'Study Abroad For Free', sub: 'report + signals · product mockup', bg: 0x0B0F0C, sets: [[0x1D6B45, 0xC77414, 0xF0C465], [0x2C7DA0, 0x1D6B45, 0xC77414], [0xC77414, 0xB4453C, 0x1D6B45]] }
}[ID];
$('#hudTitle').textContent = PAL.name; $('#hudSub').textContent = PAL.sub;
let pal = PAL.sets[0];
const css = h => '#' + h.toString(16).padStart(6, '0');
function applyCss() { document.documentElement.style.setProperty('--acc', css(pal[0])); document.documentElement.style.setProperty('--acc2', css(pal[1])); }
applyCss();

const stage = $('#stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(PAL.bg);
scene.fog = new THREE.FogExp2(PAL.bg, 0.045);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, .1, 100);

/* lights */
const amb = new THREE.AmbientLight(0x334455, .5); scene.add(amb);
const key = new THREE.DirectionalLight(pal[0], 2.2); key.position.set(5, 7, 4); key.castShadow = true;
key.shadow.mapSize.set(1024, 1024); key.shadow.camera.left = -8; key.shadow.camera.right = 8; key.shadow.camera.top = 8; key.shadow.camera.bottom = -8;
scene.add(key);
const rim = new THREE.PointLight(pal[1], 3.0, 30); rim.position.set(-6, 3, -5); scene.add(rim);
const fill = new THREE.PointLight(0xffffff, .5, 25); fill.position.set(0, 2, 7); scene.add(fill);
const kick = new THREE.PointLight(pal[2], 1.4, 20); kick.position.set(3, -1, -3); scene.add(kick);

/* ground */
const ground = new THREE.Mesh(new THREE.CircleGeometry(16, 48), new THREE.MeshStandardMaterial({ color: 0x0D1117, roughness: .38, metalness: .55 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -1.55; ground.receiveShadow = true; scene.add(ground);
const grid = new THREE.GridHelper(24, 48, pal[0], 0x1A202C); grid.position.y = -1.54; grid.material.transparent = true; grid.material.opacity = .22; grid.visible = false; scene.add(grid);

/* glow sprite texture */
function glowTex() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'); const r = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.35, 'rgba(255,255,255,.45)'); r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}
const GT = glowTex();
function glowSprite(color, scale) {
  const m = new THREE.SpriteMaterial({ map: GT, color, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: .8 });
  const s = new THREE.Sprite(m); s.scale.setScalar(scale); return s;
}
/* volumetric-ish light cones */
function cone(color) {
  const g = new THREE.ConeGeometry(2.6, 9, 32, 1, true);
  const m = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: .06, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
  const mesh = new THREE.Mesh(g, m); return mesh;
}
const coneA = cone(pal[0]); coneA.position.set(4.4, 3.4, 3.4); coneA.rotation.z = -.5; coneA.rotation.x = .35; scene.add(coneA);
const coneB = cone(pal[1]); coneB.position.set(-5, 2.6, -4); coneB.rotation.z = .6; coneB.rotation.x = -.3; scene.add(coneB);

/* devices */
const texLoader = new THREE.TextureLoader();
const base = '/src/mockups/' + ID + '/';
const uiTex = texLoader.load(base + 'hero.png'); uiTex.encoding = THREE.sRGBEncoding; uiTex.anisotropy = 4;
const mobTex = texLoader.load(base + 'mobile-1.png'); mobTex.encoding = THREE.sRGBEncoding; mobTex.anisotropy = 4;
const devices = new THREE.Group(); scene.add(devices);
const bodyMat = new THREE.MeshStandardMaterial({ color: 0x161B24, roughness: .32, metalness: .8 });
const screenMat = new THREE.MeshBasicMaterial({ map: uiTex, toneMapped: false });
const mobMat = new THREE.MeshBasicMaterial({ map: mobTex, toneMapped: false });
/* laptop */
const laptop = new THREE.Group();
const deck = new THREE.Mesh(new THREE.BoxGeometry(4.5, .14, 3), bodyMat); deck.castShadow = true; laptop.add(deck);
const lid = new THREE.Group(); lid.position.set(0, .07, -1.5);
const lidBody = new THREE.Mesh(new THREE.BoxGeometry(4.5, 2.9, .1), bodyMat); lidBody.position.y = 1.45; lidBody.castShadow = true; lid.add(lidBody);
const screen = new THREE.Mesh(new THREE.PlaneGeometry(4.24, 2.64), screenMat); screen.position.set(0, 1.45, .06); lid.add(screen);
lid.rotation.x = -.32; laptop.add(lid);
const kbGlow = new THREE.Mesh(new THREE.PlaneGeometry(4.1, 2.5), new THREE.MeshBasicMaterial({ color: pal[0], transparent: true, opacity: .10, blending: THREE.AdditiveBlending, depthWrite: false }));
kbGlow.rotation.x = -Math.PI / 2; kbGlow.position.y = .08; laptop.add(kbGlow);
laptop.position.set(-.7, -.4, 0); laptop.rotation.y = .34; devices.add(laptop);
/* phone */
const phone = new THREE.Group();
const pBody = new THREE.Mesh(new THREE.BoxGeometry(1.16, 2.4, .1), bodyMat); pBody.castShadow = true; phone.add(pBody);
const pScreen = new THREE.Mesh(new THREE.PlaneGeometry(1.04, 2.26), mobMat); pScreen.position.z = .06; phone.add(pScreen);
phone.position.set(2.5, .35, 1.1); phone.rotation.y = -.4; phone.rotation.z = .06; devices.add(phone);
/* floating detail card */
const cardTex = texLoader.load(base + 'detail.png'); cardTex.encoding = THREE.sRGBEncoding;
const card = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 1.46), new THREE.MeshBasicMaterial({ map: cardTex, toneMapped: false, transparent: true, opacity: .92 }));
card.position.set(-3.4, 1.5, -2.2); card.rotation.y = .5; devices.add(card);
/* emissive strips + glows */
const stripMat = new THREE.MeshBasicMaterial({ color: pal[0], toneMapped: false });
const strip = new THREE.Mesh(new THREE.BoxGeometry(4.5, .03, .03), stripMat); strip.position.set(-.7, -1.5, 1.6); scene.add(strip);
const strip2 = new THREE.Mesh(new THREE.BoxGeometry(.03, 2.4, .03), new THREE.MeshBasicMaterial({ color: pal[1], toneMapped: false })); strip2.position.set(3.2, .3, 1.2); scene.add(strip2);
const glows = [glowSprite(pal[0], 5), glowSprite(pal[1], 6), glowSprite(pal[2], 3.4)];
glows[0].position.set(-.7, -1.4, 1.6); glows[1].position.set(-4, 2.4, -3); glows[2].position.set(3.2, .3, 1.2);
glows.forEach(g => scene.add(g));
/* particles */
let parts = null;
function buildParts(n) {
  if (parts) { scene.remove(parts); parts.geometry.dispose(); parts.material.dispose(); }
  const g = new THREE.BufferGeometry(); const pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { pos[i * 3] = (Math.random() - .5) * 22; pos[i * 3 + 1] = Math.random() * 9 - 1.5; pos[i * 3 + 2] = (Math.random() - .5) * 22; }
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const m = new THREE.PointsMaterial({ color: pal[0], size: .045, transparent: true, opacity: .55, blending: THREE.AdditiveBlending, depthWrite: false, map: GT });
  parts = new THREE.Points(g, m); scene.add(parts);
}
buildParts(260);
renderer.shadowMap.needsUpdate = true;

/* damped orbit controls */
const state = { theta: .5, phi: 1.16, dist: 7.2, tTheta: .5, tPhi: 1.16, tDist: 7.2, height: 2.2, speed: reduce ? 0 : .10, auto: !reduce, glow: .8, tilt: -14 };
let dragging = false, px = 0, py = 0;
renderer.domElement.addEventListener('pointerdown', e => { dragging = true; px = e.clientX; py = e.clientY; });
addEventListener('pointerup', () => dragging = false);
addEventListener('pointermove', e => { if (!dragging) return; state.tTheta -= (e.clientX - px) * .005; state.tPhi = Math.max(.35, Math.min(1.45, state.tPhi - (e.clientY - py) * .004)); px = e.clientX; py = e.clientY; });
renderer.domElement.addEventListener('wheel', e => { e.preventDefault(); state.tDist = Math.max(4, Math.min(12, state.tDist + e.deltaY * .004)); $('#cDist').value = state.tDist; $('#oDist').textContent = state.tDist.toFixed(1); }, { passive: false });

/* controls wiring */
function bind(id, out, fn, fmt) { const el = $(id); el.addEventListener('input', () => { const v = parseFloat(el.value); $(out).textContent = fmt ? fmt(v) : v; fn(v); }); }
bind('#cSpeed', '#oSpeed', v => state.speed = v, v => v.toFixed(2));
bind('#cDist', '#oDist', v => state.tDist = v, v => v.toFixed(1));
bind('#cHeight', '#oHeight', v => state.height = v, v => v.toFixed(1));
bind('#cKey', '#oKey', v => { key.intensity = v; renderer.shadowMap.needsUpdate = true; }, v => v.toFixed(1));
bind('#cRim', '#oRim', v => rim.intensity = v, v => v.toFixed(1));
bind('#cGlow', '#oGlow', v => { state.glow = v; glows.forEach(g => g.material.opacity = .8 * v); coneA.material.opacity = .06 * v; coneB.material.opacity = .06 * v; kbGlow.material.opacity = .10 * v; }, v => v.toFixed(2));
bind('#cPart', '#oPart', v => buildParts(v | 0), v => v | 0);
bind('#cFog', '#oFog', v => scene.fog.density = v, v => v.toFixed(3));
bind('#cTilt', '#oTilt', v => { state.tilt = v; lid.rotation.x = v * Math.PI / 180; }, v => v | 0);
$('#cPal').addEventListener('change', e => { pal = PAL.sets[+e.target.value]; applyCss(); key.color.setHex(pal[0]); rim.color.setHex(pal[1]); kick.color.setHex(pal[2]); stripMat.color.setHex(pal[0]); strip2.material.color.setHex(pal[1]); glows[0].material.color.setHex(pal[0]); glows[1].material.color.setHex(pal[1]); glows[2].material.color.setHex(pal[2]); coneA.material.color.setHex(pal[0]); coneB.material.color.setHex(pal[1]); if (parts) parts.material.color.setHex(pal[0]); grid.material.color.setHex(pal[0]); renderer.shadowMap.needsUpdate = true; });
$('#cQual').addEventListener('change', e => renderer.setPixelRatio(Math.min(devicePixelRatio, parseFloat(e.target.value))));
$('#cWire').addEventListener('change', e => { bodyMat.wireframe = e.target.checked; ground.material.wireframe = e.target.checked; });
$('#cGrid').addEventListener('change', e => grid.visible = e.target.checked);
$('#cAuto').addEventListener('change', e => state.auto = e.target.checked);
$('#cDof').addEventListener('change', e => { scene.fog.density = e.target.checked ? parseFloat($('#cFog').value) : 0; });
const DEFAULTS = { cSpeed: .10, cDist: 7.2, cHeight: 2.2, cKey: 2.2, cRim: 3.0, cGlow: .8, cPart: 260, cFog: .045, cTilt: -14 };
function reset() {
  Object.entries(DEFAULTS).forEach(([id, v]) => { const el = $('#' + id); el.value = v; el.dispatchEvent(new Event('input')); });
  state.tTheta = .5; state.tPhi = 1.16; $('#cPal').value = 0; $('#cPal').dispatchEvent(new Event('change'));
  $('#cWire').checked = false; $('#cWire').dispatchEvent(new Event('change'));
  $('#cGrid').checked = false; $('#cGrid').dispatchEvent(new Event('change'));
  $('#cAuto').checked = !reduce; $('#cAuto').dispatchEvent(new Event('change'));
  $('#cDof').checked = true; $('#cDof').dispatchEvent(new Event('change'));
  $('#cQual').value = '1.75'; $('#cQual').dispatchEvent(new Event('change'));
}
$('#bReset').addEventListener('click', reset);
$('#bRand').addEventListener('click', () => {
  const r = (a, b) => a + Math.random() * (b - a);
  const set = (id, v) => { const el = $('#' + id); el.value = v; el.dispatchEvent(new Event('input')); };
  set('cSpeed', r(0, .4).toFixed(2)); set('cDist', r(5, 10).toFixed(1)); set('cHeight', r(1, 4.5).toFixed(1));
  set('cKey', r(1, 4).toFixed(1)); set('cRim', r(1.5, 6).toFixed(1)); set('cGlow', r(.3, 1.6).toFixed(2));
  set('cPart', (r(80, 700) | 0)); set('cFog', r(.01, .09).toFixed(3)); set('cTilt', (r(-35, 5) | 0));
  $('#cPal').value = (Math.random() * 3) | 0; $('#cPal').dispatchEvent(new Event('change'));
  state.tTheta = r(0, 6.28); state.tPhi = r(.6, 1.35);
});
$('#bExport').addEventListener('click', () => {
  renderer.render(scene, camera);
  const a = document.createElement('a'); a.download = ID + '-3d-mockup.png'; a.href = renderer.domElement.toDataURL('image/png'); a.click();
});
/* harness API */
window.__scene = {
  setView(t, p, d) { state.tTheta = t; state.tPhi = p; state.tDist = d; state.theta = t; state.phi = p; state.dist = d; },
  setAuto(v) { state.auto = v; },
  ready: false
};
/* loop */
const clock = new THREE.Clock();
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(.05, clock.getDelta()); const t = clock.elapsedTime;
  if (state.auto && !dragging) state.tTheta += state.speed * dt;
  state.theta += (state.tTheta - state.theta) * .08;
  state.phi += (state.tPhi - state.phi) * .08;
  state.dist += (state.tDist - state.dist) * .08;
  camera.position.set(Math.sin(state.theta) * Math.sin(state.phi) * state.dist, Math.cos(state.phi) * state.dist * .6 + state.height * .4, Math.cos(state.theta) * Math.sin(state.phi) * state.dist);
  camera.lookAt(0, .2, 0);
  phone.position.y = .35 + Math.sin(t * .8) * .12; phone.rotation.y = -.4 + Math.sin(t * .5) * .06;
  card.position.y = 1.5 + Math.sin(t * .6 + 2) * .1; card.rotation.y = .5 + Math.sin(t * .4) * .05;
  if (parts) { parts.rotation.y = t * .02; parts.position.y = Math.sin(t * .3) * .15; }
  glows[0].scale.setScalar(5 + Math.sin(t * 1.7) * .35 * state.glow);
  renderer.render(scene, camera);
  window.__scene.ready = true;
}
loop();
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
</body>
</html>
